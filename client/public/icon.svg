<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182024" />
      <stop offset="70%" stop-color="#0D1215" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E0522D" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#B84025" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#080B0D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C75E" />
      <stop offset="40%" stop-color="#D5A441" />
      <stop offset="100%" stop-color="#59452A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Bronze Border -->
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#59452A" stroke-width="8" rx="8" />
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#C99A3D" stroke-width="2" rx="4" opacity="0.6" />

  <!-- Corner Ornamental Pixel Brackets -->
  <!-- Top-Left -->
  <rect x="20" y="20" width="24" height="6" fill="#F0C75E" />
  <rect x="20" y="20" width="6" height="24" fill="#F0C75E" />
  <!-- Top-Right -->
  <rect x="468" y="20" width="24" height="6" fill="#F0C75E" />
  <rect x="486" y="20" width="6" height="24" fill="#F0C75E" />
  <!-- Bottom-Left -->
  <rect x="20" y="486" width="24" height="6" fill="#F0C75E" />
  <rect x="20" y="468" width="6" height="24" fill="#F0C75E" />
  <!-- Bottom-Right -->
  <rect x="468" y="486" width="24" height="6" fill="#F0C75E" />
  <rect x="486" y="468" width="6" height="24" fill="#F0C75E" />

  <!-- Crimson Eclipse Moon -->
  <circle cx="256" cy="220" r="140" fill="url(#emberGlow)" />
  <circle cx="256" cy="200" r="80" fill="#68251B" stroke="#B84025" stroke-width="4" />
  <circle cx="270" cy="190" r="75" fill="#0D1215" />

  <!-- Pixelated Bonfire Flames -->
  <polygon points="256,230 240,290 272,290" fill="#F0C75E" />
  <polygon points="244,250 228,320 260,320" fill="#E0522D" />
  <polygon points="268,250 252,320 284,320" fill="#B84025" />
  <polygon points="256,210 236,330 276,330" fill="#F0C75E" opacity="0.8" />

  <!-- Coiled Greatsword Blade in Bonfire -->
  <!-- Blade -->
  <polygon points="256,100 246,270 266,270" fill="url(#bladeGrad)" />
  <polygon points="256,100 256,270 266,270" fill="#59452A" opacity="0.3" />
  <!-- Crossguard -->
  <rect x="220" y="270" width="72" height="12" fill="#D5A441" stroke="#59452A" stroke-width="2" />
  <rect x="214" y="268" width="8" height="16" fill="#F0C75E" />
  <rect x="290" y="268" width="8" height="16" fill="#F0C75E" />
  <!-- Grip and Pommel -->
  <rect x="250" y="282" width="12" height="36" fill="#68251B" />
  <circle cx="256" cy="324" r="8" fill="#D5A441" stroke="#59452A" stroke-width="2" />

  <!-- Hearth / Embers Mound -->
  <ellipse cx="256" cy="370" rx="110" ry="24" fill="#11171A" stroke="#59452A" stroke-width="3" />
  <rect x="180" y="360" width="20" height="10" fill="#59452A" />
  <rect x="210" y="365" width="24" height="12" fill="#3D301E" />
  <rect x="270" y="364" width="26" height="12" fill="#59452A" />
  <rect x="310" y="358" width="18" height="10" fill="#3D301E" />

  <!-- Floating Ember Pixels -->
  <rect x="230" y="150" width="6" height="6" fill="#F0C75E" />
  <rect x="280" y="130" width="8" height="8" fill="#E0522D" />
  <rect x="210" y="190" width="6" height="6" fill="#B84025" />
  <rect x="295" y="175" width="5" height="5" fill="#F0C75E" />
  <rect x="190" y="220" width="7" height="7" fill="#E0522D" />
  <rect x="320" y="210" width="6" height="6" fill="#F0C75E" />

  <!-- Typography: ASHEN PATH -->
  <text x="256" y="440" text-anchor="middle" font-family="'Cinzel', serif" font-size="34" font-weight="900" fill="#E7D8B5" letter-spacing="6">ASHEN PATH</text>
</svg>
